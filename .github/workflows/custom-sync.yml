name: custom-sync
# Upstream sync for this fork. Raises ONE pull request per upstream release; merging that PR (with a MERGE COMMIT)
# is what the next release is built from. Nothing here pushes to `custom` or force-pushes. Only the `land` job merges, and only
# a real run (see it below): when every gate of the chosen candidate is green and `custom` has not moved since the sync
# started, it merges the PR itself and dispatches custom-release.yml once. In every other case the PR waits for a human.
#
#   detect   newest stable upstream release vs custom/BASE; quiet exit when there is nothing new. A stale PR of the tag that nobody
#            touched (custom moved on while it ran) is not "nothing new": it is replaced (custom/scripts/stale-sync-pr.sh).
#   merge    merge the release into sync/<tag> by script (clean, or scripted conflict rules), no model
#   agent1   (only when conflicts remain) Flash resolves the conflicted files    } custom-agent.yml, environment `agent`
#   agent2   Flash repairs the candidate using the REAL gate output of round 1,   } (agent2 and agent3 also CONTINUE a
#            or continues a round 1 that stopped with files unresolved             }  candidate that has files unresolved)
#   pick3    chooses what round 3 starts from (no model; pick-repair-base.sh)
#   agent3   Pro REPAIRS the best candidate of rounds 1 and 2 with that candidate's real gate output (same wider edit
#            scope as round 2), or continues the one that got furthest; only when no round left a usable candidate
#            does it start again from scratch
#   gates*   custom-gates.yml: install, typecheck, lint, format, unit tests, localization, e2e ratchet, e2e specs
#   open-pr  push sync/<tag> (the only branch this workflow may push), open the PR from FACTS, retire older sync PRs; close the
#            stale PR it replaces; on a re-run of the failed jobs adopt the PR attempt 1 opened (custom/scripts/open-pr.sh)
#   land     real runs only, all gates green, custom unchanged: check-run `gates / result`, merge commit, dispatch the release
#            (custom/scripts/land-sync-pr.sh). A merge by the workflow token starts no `push:` workflow, hence the dispatch.
#
# Why the merge is not `git merge <tag>`: upstream release tags are not ancestors of one another, so a plain merge
# conflicts in dozens of files nobody touched. sync-merge.sh merges with the previous BASE tag as the merge base
# (see its header), which replays exactly our changes on the new release.
#
# Manual rehearsal: Actions > custom-sync > Run workflow with `ref` (any upstream branch, tag or sha) and a throwaway
# `base_branch`. A rehearsal opens a DRAFT "[test]" PR and never changes custom/BASE, and it can never reach `land`. The model
# jobs only run from `custom`, so a rehearsal dispatched from another branch exercises everything except them (set skip_agent).
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to rehearse with (branch, tag or sha). Empty = the newest stable release. Anything that is not a release tag makes a draft [test] PR.
        required: false
        type: string
      base_branch:
        description: Branch to merge into and open the PR against
        required: false
        default: custom
        type: string
      skip_agent:
        description: Do not call the cloud model. Conflicts then become a draft [needs manual merge] PR.
        required: false
        default: false
        type: boolean

concurrency:
  group: custom-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.detect.outputs.proceed }}
      reason: ${{ steps.detect.outputs.reason }}
      is_test: ${{ steps.detect.outputs.is_test }}
      tag: ${{ steps.detect.outputs.tag }}
      tag_is_release: ${{ steps.detect.outputs.tag_is_release }}
      label: ${{ steps.detect.outputs.label }}
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      base_branch: ${{ steps.detect.outputs.base_branch }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      base_tag: ${{ steps.detect.outputs.base_tag }}
      branch: ${{ steps.detect.outputs.branch }}
      title: ${{ steps.detect.outputs.title }}
      release_url: ${{ steps.detect.outputs.release_url }}
      supersede: ${{ steps.detect.outputs.supersede }}
      orphan_branch: ${{ steps.detect.outputs.orphan_branch }}
      orphan_sha: ${{ steps.detect.outputs.orphan_sha }}
      replace_pr: ${{ steps.detect.outputs.replace_pr }}
      replace_head: ${{ steps.detect.outputs.replace_head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: custom/scripts
          persist-credentials: false
      - name: Find the release to sync
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_BASE_BRANCH: ${{ github.event.inputs.base_branch }}
        run: bash custom/scripts/detect-release.sh

  merge:
    name: merge
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.start.outputs.outcome }}
      unresolved: ${{ steps.finish.outputs.unresolved }}
    steps:
      - name: Checkout the sync scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: custom
          persist-credentials: false
      - name: Checkout the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: repo
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: repo/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Merge the upstream release
        id: start
        working-directory: repo
        env:
          SYNC_OUT: ${{ runner.temp }}/out/round-0
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          LABEL: ${{ needs.detect.outputs.label }}
          TAG: ${{ needs.detect.outputs.tag }}
          IS_TEST: ${{ needs.detect.outputs.is_test }}
          TAG_IS_RELEASE: ${{ needs.detect.outputs.tag_is_release }}
        run: |
          start=$(date +%s)
          bash "$GITHUB_WORKSPACE/tools/custom/scripts/sync-merge.sh" start
          echo "merge step took $(( $(date +%s) - start ))s; .git is $(du -sh .git | cut -f1)"
      - name: Commit the conflicted merge as an unresolved candidate
        id: finish
        if: steps.start.outputs.outcome == 'conflicts'
        working-directory: repo
        env:
          SYNC_OUT: ${{ runner.temp }}/out/round-0
        # Round 0 is what scripts alone can do. When git left real conflicts this is the fallback that always exists:
        # the merge with its conflict markers and a sentinel file, which the agent rounds try to improve on and which
        # becomes a draft [needs manual merge] PR if nothing better comes out of them (or skip_agent is set).
        run: bash "$GITHUB_WORKSPACE/tools/custom/scripts/sync-merge.sh" finish
      - name: Upload round 0
        uses: actions/upload-artifact@v7
        with:
          name: round-0
          path: ${{ runner.temp }}/out/
          retention-days: 14

  gates0:
    name: gates (round 0)
    needs: [detect, merge]
    if: needs.merge.result == 'success' && needs.merge.outputs.outcome != 'conflicts'
    uses: ./.github/workflows/custom-gates.yml
    with:
      mode: sync
      round: '0'
      base_sha: ${{ needs.detect.outputs.base_sha }}

  agent1:
    name: agent (round 1, flash)
    needs: [detect, merge]
    if: needs.merge.result == 'success' && needs.merge.outputs.outcome == 'conflicts' && github.event.inputs.skip_agent != 'true'
    uses: ./.github/workflows/custom-agent.yml
    with:
      round: '1'
      mode: first
      tier: flash
      tag: ${{ needs.detect.outputs.tag }}
      tag_is_release: ${{ needs.detect.outputs.tag_is_release }}
      is_test: ${{ needs.detect.outputs.is_test }}
      label: ${{ needs.detect.outputs.label }}
      branch: ${{ needs.detect.outputs.branch }}
      base_branch: ${{ needs.detect.outputs.base_branch }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      upstream_sha: ${{ needs.detect.outputs.upstream_sha }}
    secrets:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

  gates1:
    name: gates (round 1)
    needs: [detect, agent1]
    if: needs.agent1.result == 'success' && needs.agent1.outputs.unresolved == 'false'
    uses: ./.github/workflows/custom-gates.yml
    with:
      mode: sync
      round: '1'
      base_sha: ${{ needs.detect.outputs.base_sha }}

  agent2:
    name: agent (round 2, flash repair)
    needs: [detect, agent1, gates1]
    # Two cases. Round 1 resolved everything and its gates failed: repair it with that gate output. Round 1 stopped (the wall clock)
    # with files still unresolved (gates1 is skipped, so `!cancelled()` is what lets this job run at all): continue it. A key leak in
    # round 1 means unresolved too; it is checked here on purpose and never continued.
    if: >-
      ${{ !cancelled() && needs.agent1.result == 'success' && needs.agent1.outputs.key_leaks == '0'
      && ((needs.gates1.result == 'success' && needs.gates1.outputs.failed != '0') || needs.agent1.outputs.unresolved == 'true') }}
    uses: ./.github/workflows/custom-agent.yml
    with:
      round: '2'
      mode: repair
      tier: flash
      prev_round: '1'
      prev_gates_round: ${{ needs.gates1.result == 'success' && '1' || '' }}
      tag: ${{ needs.detect.outputs.tag }}
      tag_is_release: ${{ needs.detect.outputs.tag_is_release }}
      is_test: ${{ needs.detect.outputs.is_test }}
      label: ${{ needs.detect.outputs.label }}
      branch: ${{ needs.detect.outputs.branch }}
      base_branch: ${{ needs.detect.outputs.base_branch }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      upstream_sha: ${{ needs.detect.outputs.upstream_sha }}
    secrets:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

  gates2:
    name: gates (round 2)
    needs: [detect, agent2]
    # `!cancelled()` is needed: without a status function a job gets an implicit success() over its WHOLE ancestry, and a skipped round
    # earlier in the chain (round 2 is skipped when round 3 follows round 1 directly) made these gates skip, so the candidate of the
    # round that did run was never checked.
    if: ${{ !cancelled() && needs.agent2.result == 'success' && needs.agent2.outputs.unresolved == 'false' }}
    uses: ./.github/workflows/custom-gates.yml
    with:
      mode: sync
      round: '2'
      base_sha: ${{ needs.detect.outputs.base_sha }}

  pick3:
    name: pick the base of round 3
    needs: [detect, agent1, gates1, agent2, gates2]
    # One last attempt with the stronger model when no earlier round came out green. Never after a round whose output
    # contained the API key (a prompt that leaked once would leak again), nor after an unknown leak check.
    if: >-
      ${{ !cancelled() && needs.agent1.result == 'success'
      && needs.agent1.outputs.key_leaks == '0'
      && (needs.agent2.result == 'skipped' || needs.agent2.outputs.key_leaks == '0')
      && !(needs.gates1.result == 'success' && needs.gates1.outputs.failed == '0')
      && !(needs.gates2.result == 'success' && needs.gates2.outputs.failed == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      prev_round: ${{ steps.pick.outputs.prev_round }}
      prev_gates_round: ${{ steps.pick.outputs.prev_gates_round }}
    steps:
      - name: Checkout the sync scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: custom/scripts
          persist-credentials: false
      - name: Download every round
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/all
          pattern: round-*
          merge-multiple: true
      - name: Download every gate result
        uses: actions/download-artifact@v8
        continue-on-error: true # none exist when no round got as far as the gates
        with:
          path: ${{ runner.temp }}/all
          pattern: gates-*
          merge-multiple: true
      # repair: the best resolved candidate of rounds 1 and 2 (fewest failed gates, a tie goes to round 2), shown its own gate
      # output. retry: no round left a resolved merge to repair, so start again from the merge.
      - name: Choose the base
        id: pick
        run: bash custom/scripts/pick-repair-base.sh "$RUNNER_TEMP/all"

  agent3:
    name: agent (round 3, pro)
    needs: [detect, pick3]
    if: ${{ !cancelled() && needs.pick3.result == 'success' }}
    uses: ./.github/workflows/custom-agent.yml
    with:
      round: '3'
      mode: ${{ needs.pick3.outputs.mode }}
      tier: pro
      prev_round: ${{ needs.pick3.outputs.prev_round }}
      prev_gates_round: ${{ needs.pick3.outputs.prev_gates_round }}
      tag: ${{ needs.detect.outputs.tag }}
      tag_is_release: ${{ needs.detect.outputs.tag_is_release }}
      is_test: ${{ needs.detect.outputs.is_test }}
      label: ${{ needs.detect.outputs.label }}
      branch: ${{ needs.detect.outputs.branch }}
      base_branch: ${{ needs.detect.outputs.base_branch }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      upstream_sha: ${{ needs.detect.outputs.upstream_sha }}
    secrets:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

  gates3:
    name: gates (round 3)
    needs: [detect, agent3]
    # `!cancelled()` is needed: without a status function a job gets an implicit success() over its WHOLE ancestry, and a skipped round
    # earlier in the chain (round 2 is skipped when round 3 follows round 1 directly) made these gates skip, so the candidate of the
    # round that did run was never checked.
    if: ${{ !cancelled() && needs.agent3.result == 'success' && needs.agent3.outputs.unresolved == 'false' }}
    uses: ./.github/workflows/custom-gates.yml
    with:
      mode: sync
      round: '3'
      base_sha: ${{ needs.detect.outputs.base_sha }}

  open-pr:
    name: open-pr
    needs: [detect, merge, gates0, agent1, gates1, agent2, gates2, pick3, agent3, gates3]
    if: ${{ !cancelled() && needs.detect.outputs.proceed == 'true' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Writes the sync branch, the PR and the statuses; it never merges. It runs our scripts, git, gh and node (no repository
    # code from the candidate).
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      pr_number: ${{ steps.open.outputs.pr_number }}
      merge_sha: ${{ steps.open.outputs.merge_sha }}
      draft: ${{ steps.open.outputs.draft }}
      needs_review: ${{ steps.open.outputs.needs_review }}
      review_reasons: ${{ steps.open.outputs.review_reasons }}
      round: ${{ steps.pick.outputs.round }}
    steps:
      - name: Checkout the sync scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: custom
          persist-credentials: false
      - name: Checkout the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: repo
          fetch-depth: 0
          filter: blob:none
          # Credentials stay in the git config on purpose: this job pushes sync/<tag>.
          persist-credentials: true
      # Every artifact holds one top-level directory named like itself (round-N/, gates-N-static/), so the layout
      # under `all/` is the same whether one artifact matches or several.
      - name: Download every round
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/all
          pattern: round-*
          merge-multiple: true
      - name: Download every gate result
        uses: actions/download-artifact@v8
        continue-on-error: true # none exist when no round got as far as the gates
        with:
          path: ${{ runner.temp }}/all
          pattern: gates-*
          merge-multiple: true
      - name: Choose the candidate
        id: pick
        run: bash "$GITHUB_WORKSPACE/tools/custom/scripts/pick-round.sh" "$RUNNER_TEMP/all"
      - name: Load the candidate merge
        working-directory: repo
        env:
          ROUND_DIR: ${{ steps.pick.outputs.round_dir }}
        run: bash "$GITHUB_WORKSPACE/tools/custom/scripts/load-candidate.sh"
      - name: Write the PR from facts
        working-directory: repo
        env:
          FACTS: ${{ steps.pick.outputs.round_dir }}/sync-facts.json
          OUR_FILES: ${{ steps.pick.outputs.round_dir }}/our-files.txt
          PR_OUT: ${{ runner.temp }}/pr
          GATES_DIRS: ${{ steps.pick.outputs.gates_dirs }}
          AGENT_ROUNDS: ${{ runner.temp }}/all/agent-rounds.json
          # Round 3 counts as failed when the job that chooses its base failed: agent3 is then only "skipped".
          AGENT_RESULTS: ${{ format('1={0} 2={1} 3={2}', needs.agent1.result, needs.agent2.result, needs.pick3.result == 'failure' && 'failure' || needs.agent3.result) }}
          # From the run step of each agent job, so the PR warns about a leak even when that job died before it wrote a record.
          AGENT_KEY_LEAKS: ${{ format('1={0} 2={1} 3={2}', needs.agent1.outputs.key_leaks, needs.agent2.outputs.key_leaks, needs.agent3.outputs.key_leaks) }}
          PR_TITLE: ${{ needs.detect.outputs.title }}
          RELEASE_URL: ${{ needs.detect.outputs.release_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          FULL_DIFF_ARTIFACT: sync-review
        run: bash "$GITHUB_WORKSPACE/tools/custom/scripts/make-pr-body.sh"
      - name: Keep the full resolution diff for the reviewer
        uses: actions/upload-artifact@v7
        with:
          name: sync-review
          path: |
            ${{ runner.temp }}/pr/full-remerge-diff.patch
            ${{ runner.temp }}/pr/pr-body.md
            ${{ runner.temp }}/pr/pr-meta.json
          retention-days: 30
      - name: Push the branch and open the pull request
        id: open
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FACTS: ${{ steps.pick.outputs.round_dir }}/sync-facts.json
          PR_OUT: ${{ runner.temp }}/pr
          SUPERSEDE: ${{ needs.detect.outputs.supersede }}
          ORPHAN_BRANCH: ${{ needs.detect.outputs.orphan_branch }}
          ORPHAN_SHA: ${{ needs.detect.outputs.orphan_sha }}
          # A stale, untouched PR for this same branch: open-pr.sh re-checks it against this head sha, closes it and takes its name.
          REPLACE_PR: ${{ needs.detect.outputs.replace_pr }}
          REPLACE_HEAD: ${{ needs.detect.outputs.replace_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$GITHUB_WORKSPACE/tools/custom/scripts/open-pr.sh"

  # The only job that can merge a PR or request a release, and it exists only for a real run: a scheduled run, or a dispatch with an
  # empty `ref`, from refs/heads/custom, against an upstream release tag, with base_branch custom. A rehearsal (any `ref`, a throwaway
  # base_branch, a [test] PR, another branch) fails this `if` and the job is skipped, so its token is never even issued; the script
  # checks the same conditions again. `!cancelled()` is needed because most of the gates jobs it lists are skipped in any run.
  land:
    name: land
    needs: [detect, gates0, gates1, gates2, gates3, open-pr]
    if: >-
      ${{ !cancelled() && needs.open-pr.result == 'success' && needs.open-pr.outputs.pr_number != ''
      && github.ref == 'refs/heads/custom'
      && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == ''))
      && needs.detect.outputs.base_branch == 'custom' && needs.detect.outputs.is_test == 'false'
      && needs.detect.outputs.tag_is_release == 'true' && startsWith(needs.detect.outputs.branch, 'sync/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with these two extra scopes: `checks` for the required check-run, `actions` to dispatch the release.
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    steps:
      - name: Checkout the sync scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: custom/scripts
          persist-credentials: false
      - name: Merge the PR and request the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open-pr.outputs.pr_number }}
          MERGE_SHA: ${{ needs.open-pr.outputs.merge_sha }}
          DRAFT: ${{ needs.open-pr.outputs.draft }}
          NEEDS_REVIEW: ${{ needs.open-pr.outputs.needs_review }}
          REVIEW_REASONS: ${{ needs.open-pr.outputs.review_reasons }}
          ROUND: ${{ needs.open-pr.outputs.round }}
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          IS_TEST: ${{ needs.detect.outputs.is_test }}
          TAG_IS_RELEASE: ${{ needs.detect.outputs.tag_is_release }}
          TAG: ${{ needs.detect.outputs.tag }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          # What the chosen round's gates really did: the job result and the `failed` output (a crashed gate job counts as a failure there).
          GATES_RESULT: ${{ format('0={0} 1={1} 2={2} 3={3}', needs.gates0.result, needs.gates1.result, needs.gates2.result, needs.gates3.result) }}
          GATES_FAILED: ${{ format('0={0} 1={1} 2={2} 3={3}', needs.gates0.outputs.failed, needs.gates1.outputs.failed, needs.gates2.outputs.failed, needs.gates3.outputs.failed) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash custom/scripts/land-sync-pr.sh
