name: custom-sync
# PROBE 2 (temporary): can GITHUB_TOKEN push a merge whose history edits workflows but whose tree does not?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-probe2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Merge upstream main (link-commit trick), strip workflows, push
        run: |
          git config user.name probe; git config user.email probe@localhost
          git remote add stablyai https://github.com/stablyai/orca.git
          git fetch --no-tags --filter=blob:none stablyai main
          UP=$(git rev-parse FETCH_HEAD)
          OLD=$(git rev-parse c91a7a6ee3^{commit})
          BASE=$(git rev-parse origin/custom)
          git checkout -q -B probe-merge "$BASE"
          LINK=$(git commit-tree "$UP^{tree}" -p "$UP" -p "$OLD" -m link)
          git merge --no-commit --no-ff "$LINK" || true
          git ls-files -u | cut -f2 | sort -u | head -20
          # strip non-custom workflows and take ours for every unmerged file (probe only)
          for p in $(git ls-files -- .github/workflows); do case "${p#.github/workflows/}" in custom-*) ;; *) git rm -q -f -- "$p";; esac; done
          git rm -q -f --ignore-unmatch -- .github/dependabot.yml
          for p in $(git diff --name-only --diff-filter=U); do git checkout "$BASE" -- "$p"; done
          git ls-files -u | wc -l
          git commit -q -m "probe merge"
          echo "tree diff vs base touching workflows:"; git diff --name-only "$BASE" HEAD -- .github/workflows | head
          echo "new commits: $(git rev-list --count HEAD ^"$BASE")"
          set +e
          git push origin HEAD:refs/heads/test/probe-merge 2>&1 | tee push.out
          echo "PUSH_RC=${PIPESTATUS[0]}"
